{{ define "main" }}
<article class="page-content">
  <div class="content-body-wide">
    <div class="label">{{ site.Title }}</div>
    <h1>{{ .Title }}</h1>
    {{ .Content }}

    <div class="projects-grid">
      {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="project-card"
         {{ with .Params.card_color }}style="--card-bg: {{ . }}"{{ end }}>
        <div>
          <h3>{{ .Title }}</h3>
          {{ with .Params.subtitle }}<p>{{ . }}</p>{{ end }}
        </div>
        <span class="project-arrow">&rarr;</span>
      </a>
      {{ end }}
    </div>
  </div>
</article>
{{ end }}
