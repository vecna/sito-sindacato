{{ define "main" }}
<article class="page-content ghostati-gallery-page">
  <div class="content-body-wide">
    <div class="label">Ghòstati! · Gallery</div>
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}<p class="initiative-subtitle">{{ . }}</p>{{ end }}
    <div class="ghostati-gallery-intro">{{ .Content }}</div>
    <div class="ghostati-gallery">
      {{ range .Params.gallery_items }}
      {{ $item := . }}
      <figure class="ghostati-gallery__item">
        <img src="{{ .src }}" alt="{{ .title }}" loading="lazy">
        <figcaption>
          <h2>{{ .title }}</h2>
          <p>{{ .caption }}</p>
          {{ with .video }}
          <video class="ghostati-gallery__video" autoplay muted loop playsinline preload="metadata" aria-label="{{ if eq $.Site.Language.Lang "en" }}Video check:{{ else }}Verifica video:{{ end }} {{ $item.title }}">
            <source src="{{ . }}" type="video/mp4">
            <a href="{{ . }}">{{ if eq $.Site.Language.Lang "en" }}Open the video check{{ else }}Apri il video della verifica{{ end }}</a>
          </video>
          {{ end }}
          {{ with .outcome }}<p class="ghostati-gallery__outcome"><strong>{{ if eq $.Site.Language.Lang "en" }}Documented outcome:{{ else }}Esito documentato:{{ end }}</strong> {{ . }}</p>{{ end }}
        </figcaption>
      </figure>
      {{ end }}
    </div>
  </div>
</article>
{{ end }}
