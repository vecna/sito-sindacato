<header>
  <nav class="site-nav">
    {{- $homeEntry := index .Site.Menus.main 0 -}}
    <a href="{{ $homeEntry.URL }}" class="nav-logo">{{ $homeEntry.Name }}</a>

    <div class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </div>

    <ul class="nav-links" id="nav-links">
      {{- range after 1 .Site.Menus.main }}
      <li><a href="{{ .URL }}" class="nav-link">{{ .Name }}</a></li>
      {{- end }}
      <li class="spacer"></li>
      {{- range hugo.Sites }}
      <li>
        <a href="/{{ .Language.Lang }}/"
           class="nav-link lang-link{{ if eq $.Language.Lang .Language.Lang }} lang-active{{ end }}">
          {{ upper .Language.Lang }}
        </a>
      </li>
      {{- end }}
    </ul>
  </nav>
</header>
